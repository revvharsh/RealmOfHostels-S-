    <script>
      (function() {
        // Suppress unhandled errors if an external/iframe script attempts to set window.fetch
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Ensure window.fetch is configurable and has a setter so polyfills/proxies do not throw
        try {
          var originalFetch = typeof window !== 'undefined' ? window.fetch : undefined;
          var currentFetch = originalFetch;

          function setupSettableFetch(target) {
            if (!target) return;
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!desc || desc.configurable) {
                Object.defineProperty(target, 'fetch', {
                  configurable: true,
                  enumerable: true,
                  get: function() {
                    return currentFetch;
                  },
                  set: function(fn) {
                    currentFetch = fn;
                  }
                });
              }
            } catch (err) {}
          }

          if (typeof Window !== 'undefined' && Window.prototype) {
            setupSettableFetch(Window.prototype);
          }
          if (typeof window !== 'undefined') {
            var proto = Object.getPrototypeOf(window);
            while (proto && proto !== Object.prototype) {
              setupSettableFetch(proto);
              proto = Object.getPrototypeOf(proto);
            }
            setupSettableFetch(window);
          }
          if (typeof globalThis !== 'undefined' && globalThis !== window) {
            setupSettableFetch(globalThis);
          }
        } catch (e) {}
      })();
    </script>
